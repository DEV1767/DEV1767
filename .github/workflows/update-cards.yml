name: Update profile cards

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", "fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py "${{ github.repository_owner }}"
      - name: Render cards
        run: python scripts/render_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
