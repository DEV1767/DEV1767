<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 66" width="200" height="66" role="img"><defs><style>@font-face{font-family:'Orbitron';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Fira Code';font-weight:400;src:url(data:font/woff;base64,) format('woff')}
.o{font-family:'Orbitron',sans-serif}.f{font-family:'Fira Code',monospace}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}60%{transform:scale(1.25)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes swing{from{opacity:0;transform:translateY(34px) rotate(-3deg)}
  60%{opacity:1;transform:translateY(-5px) rotate(.8deg)}80%{transform:translateY(1px) rotate(-.2deg)}}
@keyframes beam{from{transform:translateX(-160px)}to{transform:translateX(960px)}}
@keyframes pulse{0%{r:3.5;opacity:1}70%,100%{r:9;opacity:0}}
@keyframes rot{0%{opacity:0;transform:translateY(7px)}3%,22%{opacity:1;transform:none}26%,100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes draw{from{transform:scaleX(0)}}
.a{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.a,.a *{animation:none!important}.l2,.l3,.l4,.cf,.pulse{display:none}}</style></defs><g class="a" style="animation:rise 0.6s 3.5s both cubic-bezier(.2,.8,.2,1)"><rect x="6" y="6" width="192" height="58" rx="12" fill="#15171F"/><rect x="2" y="2" width="192" height="58" rx="12" fill="#FF4D3D" stroke="#15171F" stroke-width="2"/><text class="o" x="18" y="29" font-size="12.5" font-weight="700" fill="#fff">Email</text><text class="f" x="18" y="47" font-size="10.5" fill="#fff" opacity=".85">p622133@gmail.com</text><path d="M158 34h16m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>